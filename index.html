<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTC Anna Nagar — Attendance Register</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123a32">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root {
    --ink: #1c2b24;
    --paper: #f6f4ee;
    --panel: #ffffff;
    --line: #d9d3c3;
    --brand: #1e5b4f;
    --brand-deep: #123a32;
    --accent: #c9622a;
    --muted: #6b6357;
    --code-present: #2f7d5a;
    --code-present-bg: #e3f2ea;
    --code-off: #8a8477;
    --code-off-bg: #ece9e1;
    --code-leave: #b0522f;
    --code-leave-bg: #f7e6dc;
    --code-absent: #b23a3a;
    --code-absent-bg: #f9e2e2;
    --code-other: #4a6fa5;
    --code-other-bg: #e5ecf6;
    --radius: 10px;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --serif: 'Source Serif 4', 'Georgia', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0 0 60px 0;
  }
  header {
    background: var(--brand-deep);
    color: #f2efe6;
    padding: 22px 24px 20px;
    position: sticky; top: 0; z-index: 20;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .header-inner { max-width: 1100px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #b9d4c8; margin-bottom: 6px; }
  h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0 0 4px 0; letter-spacing: -0.01em; }
  .subline { font-size: 13px; color: #c7d9d0; margin-bottom: 16px; }
  .subline b { color: #fff; font-weight: 600; }
  .search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .more-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search-box { position: relative; flex: 1; min-width: 220px; }
  .search-box input {
    width: 100%; padding: 12px 14px 12px 40px; border-radius: var(--radius); border: none;
    font-size: 15px; font-family: var(--mono); background: #fff; color: var(--ink); outline: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .search-box input:focus { box-shadow: 0 0 0 3px var(--accent); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; opacity: 0.5; }
  .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; display: none; padding: 4px; }
  select#sectionFilter, select#periodSelect {
    padding: 12px 14px; border-radius: var(--radius); border: none; background: #fff;
    font-family: var(--sans); font-size: 14px; color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,0.15); cursor: pointer;
  }
  .import-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 12px 16px; border-radius: var(--radius);
    border: 1px dashed rgba(255,255,255,0.4); background: rgba(255,255,255,0.06); color: #f2efe6;
    font-family: var(--sans); font-size: 13.5px; cursor: pointer; white-space: nowrap;
  }
  .import-btn:hover { background: rgba(255,255,255,0.14); }
  .import-btn svg { width: 15px; height: 15px; }
  #fileInput { display: none; }
  #dbfFileInput { display: none; }
  .result-count { font-family: var(--mono); font-size: 12px; color: #a9c2b7; margin-top: 10px; }
  .import-msg { font-family: var(--mono); font-size: 12px; margin-top: 8px; padding: 8px 12px; border-radius: 7px; display: none; }
  .import-msg.show { display: block; }
  .import-msg.ok { background: rgba(80,180,130,0.18); color: #cdeedd; }
  .import-msg.err { background: rgba(200,90,90,0.2); color: #f9d6d6; }
  main { max-width: 1100px; margin: 24px auto 0; padding: 0 24px; }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-state .big-icon { font-family: var(--serif); font-size: 52px; color: var(--line); margin-bottom: 10px; }
  .empty-state h3 { font-family: var(--serif); font-size: 19px; color: var(--ink); margin: 0 0 6px; }
  .empty-state p { font-size: 14px; margin: 0; }
  .list-view .emp-row {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: border-color 0.15s, transform 0.1s; flex-wrap: wrap; gap: 8px;
  }
  .list-view .emp-row:hover { border-color: var(--brand); transform: translateX(2px); }
  .emp-row .id-block { display:flex; align-items:baseline; gap: 10px; flex-wrap: wrap; }
  .emp-row .staffno { font-family: var(--mono); font-size: 13px; color: var(--brand); font-weight: 600; background: #e3f2ea; padding: 3px 8px; border-radius: 5px; }
  .emp-row .name { font-weight: 600; font-size: 15px; }
  .emp-row .desig { color: var(--muted); font-size: 12.5px; }
  .wo-tag {
    font-family: var(--mono); font-size: 10.5px; color: #6b5a3f; background: #f2e8d5;
    border: 1px solid #e0cfa8; padding: 2px 7px; border-radius: 12px; white-space: nowrap;
  }
  .emp-row .mini-stats { font-family: var(--mono); font-size: 12px; color: var(--muted); display:flex; gap:14px; }
  .emp-row .mini-stats span b { color: var(--ink); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: 0 3px 14px rgba(20,30,25,0.06); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--brand); text-decoration: none; margin-bottom: 16px; cursor: pointer; background: none; border: none; padding: 0; }
  .back-link:hover { text-decoration: underline; }
  .emp-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 20px; }
  .emp-header .staffno-big { font-family: var(--mono); font-size: 13px; color: var(--brand); font-weight: 700; letter-spacing: 0.04em; }
  .name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .emp-header h2 { font-family: var(--serif); font-size: 24px; margin: 4px 0 2px; }
  .emp-header .desig-big { color: var(--muted); font-size: 14px; }
  .emp-header .meta-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 20px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }
  .stats-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat-box { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px; text-align: center; }
  .stat-box .num { font-family: var(--mono); font-size: 19px; font-weight: 700; color: var(--brand); }
  .stat-box .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 2px; }
  .stat-box.wo-box { background: #f2e8d5; border-color: #e0cfa8; }
  .stat-box.wo-box .num { color: #6b5a3f; font-size: 15px; }
  .cal-section-title { font-family: var(--serif); font-size: 15px; color: var(--ink); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .cal-section-title .rule { flex: 1; height: 1px; background: var(--line); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 26px; }
  .cal-cell { border-radius: 8px; padding: 8px 6px 7px; text-align: center; border: 1px solid transparent; min-height: 58px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .cal-cell .date-lbl { font-family: var(--mono); font-size: 10px; opacity: 0.7; margin-bottom: 3px; }
  .cal-cell .code { font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
  .cal-cell.month-boundary { border-left: 2px dashed var(--accent); }
  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 6px; }
  .weekday-row div { text-align: center; font-family: var(--mono); font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
  .legend { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .legend-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
  .legend-items { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .legend-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }

  .report-heading { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--brand); margin-bottom: 8px; }
  .report-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: var(--radius);
    border: 1.5px solid var(--brand);
    background: #e3f2ea;
    color: var(--brand);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .report-btn:hover { background: var(--brand); color: #fff; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 26px;
  }
  .cat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .cat-card .cat-name {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .cat-card .cat-count {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--brand);
  }
  .cat-card .cat-count-lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .cat-mini-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .cat-mini-stats b { color: var(--ink); }

  .flag-banner {
    background: #f9e2e2;
    border: 1px solid #e3b3b3;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    cursor: pointer;
  }
  .flag-banner:hover { border-color: var(--code-absent); }
  .flag-banner .flag-title {
    font-family: var(--serif);
    font-size: 16px;
    color: #7a2828;
  }
  .flag-banner .flag-count {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 700;
    color: var(--code-absent);
  }
  .flag-banner .flag-sub { font-size: 12px; color: #8a5a5a; }

  .flag-list .flag-row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    cursor: pointer;
  }
  .flag-row:hover { border-color: var(--code-absent); }
  .flag-row .id-block { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .flag-row .badge-days {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--code-absent);
    background: #f9e2e2;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .cat-flag-group {
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .cat-flag-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--paper);
    cursor: pointer;
  }
  .cat-flag-header:hover { background: #efe9d9; }
  .cat-flag-name { font-weight: 600; font-size: 13.5px; }
  .cat-flag-count {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--code-absent);
    background: #f9e2e2;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
  }
  .cat-flag-group .flag-list { padding: 10px; margin: 0; }
  .cat-flag-group .flag-row { margin-bottom: 6px; }
  .cat-flag-group .flag-row:last-child { margin-bottom: 0; }
  footer { max-width: 1100px; margin: 30px auto 0; padding: 0 24px; font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; }
  .more-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 38px;
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: var(--radius);
    color: #f2efe6;
    cursor: pointer;
  }
  .more-toggle svg { width: 18px; height: 18px; }
  @media (max-width: 640px) {
    .cal-grid { grid-template-columns: repeat(4, 1fr); }
    .weekday-row { display: none; }
    .emp-row .mini-stats { display: none; }

    header { padding: 12px 14px 10px; }
    .eyebrow { font-size: 9px; margin-bottom: 2px; }
    h1 { font-size: 17px; margin: 0 0 2px 0; }
    .subline { font-size: 10.5px; margin-bottom: 8px; line-height: 1.4; }
    .search-row { gap: 6px; }
    .search-box input { padding: 9px 12px 9px 34px; font-size: 13px; }
    .search-icon { left: 11px; width: 14px; height: 14px; }

    /* search box + toggle button share the first row */
    .search-row { display: grid; grid-template-columns: 1fr auto; grid-auto-flow: row; column-gap: 6px; }
    .search-box { grid-column: 1; }
    .more-toggle { grid-column: 2; display: flex; }

    .more-controls {
      grid-column: 1 / -1;
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .more-controls.expanded { display: flex; }
    .more-controls select, .more-controls .import-btn, .more-controls .back-link {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 12px;
      font-size: 12.5px;
    }
    .more-controls .back-link { padding: 6px 2px; text-align: left; }
    .result-count { margin-top: 6px; font-size: 10.5px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="eyebrow" id="eyebrowLine">MTC (Chennai) Ltd</div>
    <h1>Employee Attendance Register</h1>
    <div class="subline" id="periodLine">—</div>
    <div class="search-row">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#1c2b24" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search by employee no. or name…" autocomplete="off">
        <button class="clear-btn" id="clearBtn">&times;</button>
      </div>
      <button class="more-toggle" id="moreToggle" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="more-controls" id="moreControls">
        <select id="sectionFilter"><option value="">All sections</option></select>
        <select id="periodSelect"></select>
        <label class="import-btn" for="fileInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
          1. Import month file
        </label>
        <input id="fileInput" type="file" accept=".txt">
        <label class="import-btn" for="dbfFileInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
          2. Update duty code file
        </label>
        <input id="dbfFileInput" type="file" accept=".dbf">
        <button class="import-btn" id="summaryBtn" style="border-style: solid;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
          Report Summary
        </button>
        <button class="back-link" id="clearStoreBtn" style="color:#e8c99a;">Clear saved months</button>
      </div>
    </div>
    <div class="import-msg" id="importMsg"></div>
    <div class="result-count" id="resultCount"></div>
  </div>
</header>

<main id="mainContent"></main>

<script>
const INITIAL_DATA = JSON.parse(document.getElementById('attendance-data').textContent);
const weekdayShort = ['Mo','Tu','We','Th','Fr','Sa','Su'];
const WEEKDAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const CODE_MEANING = {
  PP: 'Present (Full)', OD: 'On Duty', WO: 'Weekly Off', OF: 'Present (Field/On Duty)',
  CL: 'Casual Leave', EL: 'Earned Leave', ML: 'Medical Leave', LP: 'Loss of Pay',
  FP: 'Festival/Paid Holiday', FA: 'Failed to Attend / Absent', AB: 'Absent',
  CO: 'Compensatory Off', SO: 'Special Off', TR: 'Training', PM: 'Present (Half - Morning)',
  DD: 'Double Duty', MI: 'Missing/Muster Incomplete', PC: 'Paid Casual', S1: 'Special 1',
  BD: 'Break Duty', CD: 'Compensatory Duty', CR: 'Casual Rest', CT: 'Casual Training',
  DO: 'Day Off', DR: 'Driver Rest', EX: 'Extra Duty', HO: 'Holiday', LD: 'Late Duty',
  PE: 'Personal Emergency', WE: 'Weekly Extra', WM: 'Weekly Morning', WP: 'Weekly Present',
  WS: 'Weekly Split', '--': 'No Data', '..': 'Not Marked / Pending'
};

// 'OF' is treated as a Present-category code (on-field / on-duty), same bucket as PP/OD.
function codeClass(code) {
  if (['PP','OD','PM','DD','CD','LD','EX','OF'].includes(code)) return 'present';
  if (['WO','SO','DO'].includes(code)) return 'off';
  if (['CL','EL','ML','FP','PC','TR','S1','HO','PE'].includes(code)) return 'leave';
  if (['FA','AB'].includes(code)) return 'absent';
  return 'other';
}

const CLASS_STYLE = {
  present: {fg: 'var(--code-present)', bg: 'var(--code-present-bg)'},
  off:     {fg: 'var(--code-off)', bg: 'var(--code-off-bg)'},
  leave:   {fg: 'var(--code-leave)', bg: 'var(--code-leave-bg)'},
  absent:  {fg: 'var(--code-absent)', bg: 'var(--code-absent-bg)'},
  other:   {fg: 'var(--code-other)', bg: 'var(--code-other-bg)'}
};

// ---- Filename-driven period rule ----
// cln + MM + YY .txt  ->  period runs 21st of (MM-1) to 20th of MM (2000+YY)
// e.g. cln0826.txt -> 21 Jul 2026 - 20 Aug 2026
//      cln0926.txt -> 21 Aug 2026 - 20 Sep 2026
function periodFromFilename(filename) {
  const m = filename.match(/cln\s*(\d{2})(\d{2})\s*\.txt$/i);
  if (!m) return null;
  const endMonth = parseInt(m[1], 10);
  const endYear = 2000 + parseInt(m[2], 10);
  let startMonth = endMonth - 1;
  let startYear = endYear;
  if (startMonth < 1) { startMonth = 12; startYear -= 1; }
  return { start_month: startMonth, start_year: startYear };
}

// ---- Fixed-width parser for ATTMENU-style export text ----
function parseAttendanceText(text, filename) {
  const lines = text.split(/\r\n|\n|\r/);

  // Detect which of the two known report layouts this file uses:
  //  Format A: "S.L|STAFF  NAME ... DESIGNATION|..." header, single space-separated code blob
  //            per employee. Header's own MM/YYYY = the STARTING month (verified against real
  //            employee data across multiple months: header 08/2026 -> 31 codes -> 21Aug-20Sep).
  //  Format B: "SNO|EDPNO |  NAME  |P.MONTH ATTEN.|21|22|...|20|CL EL ML|..." header, one
  //            pipe-delimited field per day. Header's own MM/YYYY = the ENDING month (verified:
  //            header 05/2026 -> 30 day-columns -> 21Apr-20May).
  let format = 'A';
  for (const line of lines) {
    if (line.indexOf('SNO|EDPNO') !== -1) { format = 'B'; break; }
    if (line.indexOf('S.L|STAFF') !== -1) { format = 'A'; break; }
  }

  let currentSection = null, currentBranch = null;
  let headerMonth = null, headerYear = null;
  const employees = [];

  for (const raw of lines) {
    const line = raw;
    if (line.indexOf('BRANCH :') !== -1) {
      const m = line.match(/BRANCH\s*:\s*(.+?)\s{2,}/);
      if (m) currentBranch = m[1].trim();
    }
    if (line.indexOf('SECTION :') !== -1) {
      const m = line.match(/SECTION\s*:\s*(\d+)/);
      if (m) currentSection = m[1];
    }
    if (headerMonth === null) {
      const m = line.match(/FOR THE MONTH OF\s*(\d{2})\/(\d{4})/);
      if (m) { headerMonth = parseInt(m[1],10); headerYear = parseInt(m[2],10); }
    }
    if (/^\s*\d+\|[A-Z0-9]/.test(line)) {
      const parts = line.split('|');

      if (format === 'A') {
        if (parts.length < 6) continue;
        const f2 = parts[1];
        const staffno = f2.slice(0,7).trim();
        const name = f2.slice(7,22).trim();
        const desig = f2.slice(22,33).trim();
        // codes: however many day-columns are actually present (10, 15, 31, whatever)
        const codes = parts[3].trim().split(/\s+/).filter(Boolean);
        if (codes.length < 1) continue;
        const leavebal = (parts[4]||'').trim();
        const attstatus = (parts[5]||'').trim();
        employees.push({staffno, name, designation: desig, section: currentSection,
          branch: currentBranch, codes, leavebal, attstatus});
      } else {
        // Format B: sno|staffno|name|prevmonth|day1|day2|...|dayN|leavebal|attstatus
        if (parts.length < 8) continue;
        const staffno = parts[1].trim();
        const name = parts[2].trim();
        // Day fields keep their position (blank = not yet recorded) — map blank to '..'
        // so display logic treats it the same as the source system's own placeholder.
        const codes = parts.slice(4, parts.length - 2).map(p => { const t = p.trim(); return t === '' ? '..' : t; });
        if (codes.length < 1) continue;
        const leavebal = (parts[parts.length-2]||'').trim();
        const attstatus = (parts[parts.length-1]||'').trim();
        employees.push({staffno, name, designation: '', section: currentSection,
          branch: currentBranch, codes, leavebal, attstatus});
      }
    }
  }

  if (employees.length === 0) {
    throw new Error('No employee rows recognised in this file.');
  }

  // Period: verified directly against each file's own printed weekday header row (e.g.
  // "Th Fr Sa Su Mo Tu We..." next to the day-number columns) — for BOTH formats, the header's
  // MM/YYYY is the ENDING month of the 21st-20th cycle, so start = MM-1. Confirmed by matching
  // the file's stated first-column weekday against the real calendar date for header_month-1's
  // 21st (e.g. header 08/2026 -> 21-Jul-2026 is a Tuesday, matching the file's own "Tu" label).
  // Fallback to the clnMMYY.txt filename if no header found.
  let period = null;
  if (headerMonth !== null) {
    let sm = headerMonth - 1, sy = headerYear;
    if (sm < 1) { sm = 12; sy -= 1; }
    period = { start_month: sm, start_year: sy };
  }
  if (!period) {
    period = filename ? periodFromFilename(filename) : null;
    if (!period) {
      throw new Error('No "FOR THE MONTH OF MM/YYYY" header found, and filename is not in "clnMMYY.txt" format.');
    }
  }

  return {
    meta: { branch: currentBranch, start_month: period.start_month, start_year: period.start_year, source_filename: filename || null },
    employees
  };
}

// Build day labels (period start .. as many days as codes exist) for a dataset
function buildDayLabels(dataset) {
  const {start_month, start_year} = dataset.meta;
  const start = new Date(start_year, start_month - 1, 21);

  // The true cycle always ends on the 20th of the following month — never later — regardless
  // of how many day-columns the source file padded out to (it always exports 31, even for
  // 30-day or 28/29-day starting months). Cap at that real calendar length, but still allow a
  // genuinely partial file (fewer codes than the full cycle, e.g. 10 or 15 days) to show fewer.
  let endMonth = start_month + 1, endYear = start_year;
  if (endMonth > 12) { endMonth = 1; endYear += 1; }
  const cycleEnd = new Date(endYear, endMonth - 1, 20);
  const calendarDays = Math.round((cycleEnd - start) / 86400000) + 1;

  const maxCodesLength = Math.max(...dataset.employees.map(e => e.codes.length));
  const numDays = Math.min(maxCodesLength, calendarDays);

  const labels = [];
  const d = new Date(start);
  for (let i = 0; i < numDays; i++) {
    labels.push({
      day: d.getDate(), month: d.getMonth()+1, year: d.getFullYear(),
      label: String(d.getDate()).padStart(2,'0') + '-' + d.toLocaleString('en',{month:'short'}),
      weekday: d.getDay()
    });
    d.setDate(d.getDate()+1);
  }
  return labels;
}

function attendanceMonthLabel(dataset) {
  // The 21st.. cycle starting in start_month is named after the FOLLOWING month
  // (e.g. 21 Jul - 20 Aug = "August" attendance).
  let m = dataset.meta.start_month + 1;
  let y = dataset.meta.start_year;
  if (m > 12) { m = 1; y += 1; }
  return MONTH_NAMES[m-1] + ' ' + y;
}

function periodRangeLabel(dayLabels) {
  const first = dayLabels[0], last = dayLabels[dayLabels.length-1];
  const spansYear = last.year !== first.year;
  return `${first.label} ${first.year} – ${last.label}${spansYear ? ' ' + last.year : ''} ${!spansYear ? '' : ''}`.replace(/\s+/g,' ').trim();
}

// ---- Multi-month store (max 5 months, oldest evicted automatically) ----
// Persisted to localStorage so the last 5 imported months survive reopening the file.
const STORAGE_KEY = 'mtcAttendanceStoreV1';
const periods = {};
const periodOrder = []; // insertion order, oldest first
const MAX_PERIODS = 5;

function registerDataset(dataset) {
  const dayLabels = buildDayLabels(dataset);
  const monthLabel = attendanceMonthLabel(dataset);
  const key = dataset.meta.start_year + '-' + String(dataset.meta.start_month).padStart(2,'0');
  let evictedLabel = null;

  if (!(key in periods)) {
    // Evict the oldest loaded month once we're about to exceed the cap.
    if (periodOrder.length >= MAX_PERIODS) {
      const oldestKey = periodOrder.shift();
      evictedLabel = periods[oldestKey] ? periods[oldestKey].monthLabel : oldestKey;
      delete periods[oldestKey];
    }
    periodOrder.push(key);
  }

  periods[key] = { dataset, dayLabels, monthLabel, rangeLabel: periodRangeLabel(dayLabels) };
  return { key, evictedLabel };
}

function saveStore(activeKeyToSave) {
  try {
    const payload = {
      activeKey: activeKeyToSave,
      datasets: periodOrder.map(k => periods[k].dataset)
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    // localStorage full or unavailable — app still works, just won't persist this time.
  }
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.datasets) || parsed.datasets.length === 0) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

// Bootstrap: restore previously imported months if any exist. If the person has explicitly
// cleared everything, start truly empty — never re-seed the bundled sample automatically.
let activeKey = null;
const savedStore = loadStore();
if (savedStore && savedStore.cleared) {
  // explicit clear — leave periods/periodOrder empty, activeKey stays null
} else if (savedStore && Array.isArray(savedStore.datasets) && savedStore.datasets.length) {
  savedStore.datasets.forEach(ds => { activeKey = registerDataset(ds).key; });
  if (savedStore.activeKey && periods[savedStore.activeKey]) {
    activeKey = savedStore.activeKey;
  }
} else {
  // very first run ever (no localStorage entry at all) — seed with the bundled sample month
  activeKey = registerDataset(INITIAL_DATA).key;
  saveStore(activeKey);
}

function refreshPeriodSelect() {
  periodSelect.innerHTML = '';
  if (periodOrder.length === 0) {
    periodSelect.innerHTML = '<option value="">No months loaded</option>';
    periodSelect.disabled = true;
    return;
  }
  periodSelect.disabled = false;
  periodOrder.forEach(key => {
    const p = periods[key];
    if (!p) return;
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = p.monthLabel + ' Attendance';
    if (key === activeKey) opt.selected = true;
    periodSelect.appendChild(opt);
  });
}

function refreshSectionFilter() {
  if (!activeKey || !periods[activeKey]) {
    sectionFilter.innerHTML = '<option value="">All sections</option>';
    sectionFilter.disabled = true;
    return;

}

function computeStats(codes) {
  const stats = {};
  codes.forEach(c => { stats[c] = (stats[c]||0) + 1; });
  return stats;
}

// Determine an employee's fixed weekly-off day: the weekday that most often carries a 'WO' code.
function computeWeeklyOff(emp, dayLabels) {
  const counts = [0,0,0,0,0,0,0];
  emp.codes.forEach((c, i) => {
    if (c === 'WO' && dayLabels[i]) counts[dayLabels[i].weekday]++;
  });
  let max = 0, idx = -1;
  counts.forEach((c, i) => { if (c > max) { max = c; idx = i; } });
  return idx === -1 ? null : WEEKDAY_FULL[idx];
}

// Employee category is inferred from the first letter of the employee number.
const CATEGORY_MAP = {
  A: 'ADMIN',
  T: 'TECHNICAL',
  C: 'CONDUCTOR',
  D: 'DRIVER',
  B: 'BOTH DRIVER-CUM-CONDUCTOR'
};
function employeeCategory(staffno) {
  const letter = (staffno || '').trim().charAt(0).toUpperCase();

}
const CAT_ORDER = ['ADMIN','TECHNICAL','CONDUCTOR','DRIVER','BOTH DRIVER-CUM-CONDUCTOR','OTHER / UNCLASSIFIED'];

// ---- Duty code master (attcode.dbf) — Report D validates imported codes against this ----
let validDutyCodes = null;   // Set of valid code strings, or null if no dbf loaded yet
let dutyCodeMeta = {};       // code -> description, when the dbf has one
const DUTY_CODE_STORAGE_KEY = 'mtcDutyCodesV1';

// Minimal dBase III/IV (.dbf) reader — enough to pull out the duty-code list.
// Reads the field descriptors, then every record, and treats each character-type
// field value (trimmed, uppercased) that looks like a short code (<=4 chars, no
// spaces) as a candidate duty code; the first other text-like field found on the
// same record (if any) is kept as that code's description.
function parseDBF(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  const bytes = new Uint8Array(arrayBuffer);
  const numRecords = view.getUint32(4, true);
  const headerLen = view.getUint16(8, true);
  const recordLen = view.getUint16(10, true);

  const fields = [];
  let pos = 32;
  while (pos < headerLen - 1 && bytes[pos] !== 0x0D) {
    let name = '';
    for (let i = 0; i < 11; i++) {
      const b = bytes[pos + i];
      if (b === 0) break;
      name += String.fromCharCode(b);
    }
    const type = String.fromCharCode(bytes[pos + 11]);
    const len = bytes[pos + 16];
    fields.push({ name: name.trim(), type, len });
    pos += 32;
  }

  const decoder = new TextDecoder('latin1');
  const records = [];
  let recPos = headerLen;
  for (let r = 0; r < numRecords; r++) {
    if (recPos + recordLen > bytes.length) break;
    let fpos = recPos + 1; // skip deletion flag byte
    const rec = {};
    fields.forEach(f => {
      const raw = decoder.decode(bytes.slice(fpos, fpos + f.len)).trim();
      rec[f.name] = raw;
      fpos += f.len;
    });
    records.push(rec);
    recPos += recordLen;
  }
  return { fields, records };
}

function extractDutyCodesFromDBF(parsed) {
  const codes = new Set();
  const meta = {};
  // Prefer explicitly named fields (this app's real attcode.dbf has CODE/DESC columns) —
  // only fall back to guessing short-token fields if no such names exist.
  const codeFieldName = (parsed.fields.find(f => /CODE/i.test(f.name)) || {}).name;
  const descFieldName = (parsed.fields.find(f => /DESC/i.test(f.name)) || {}).name;

  parsed.records.forEach(rec => {
    let codeVal = null, descVal = null;
    if (codeFieldName && rec[codeFieldName]) {
      codeVal = rec[codeFieldName].trim();
      if (descFieldName && rec[descFieldName]) descVal = rec[descFieldName].trim();
    } else {
      // Fallback heuristic for differently-structured dbf files.
      const values = Object.entries(rec);
      const codeEntry = values.find(([k, v]) => /^[A-Z0-9\-]{1,4}$/.test(v));
      if (!codeEntry) return;
      codeVal = codeEntry[1];
      const descEntry = values
        .filter(([k, v]) => v !== codeVal && v.length > 4)
        .sort((a, b) => b[1].length - a[1].length)[0];
      if (descEntry) descVal = descEntry[1];
    }
    if (!codeVal) return;
    codes.add(codeVal.toUpperCase());
    if (descVal) meta[codeVal.toUpperCase()] = descVal;
  });
  return { codes, meta };
}

function saveDutyCodes() {
  try {
    localStorage.setItem(DUTY_CODE_STORAGE_KEY, JSON.stringify({
      codes: validDutyCodes ? Array.from(validDutyCodes) : null,
      meta: dutyCodeMeta
    }));
  } catch (e) {}
}
function loadDutyCodes() {
  try {
    const raw = localStorage.getItem(DUTY_CODE_STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed.codes) validDutyCodes = new Set(parsed.codes);
    dutyCodeMeta = parsed.meta || {};
  } catch (e) {}
}
loadDutyCodes();

// Codes that are always allowed regardless of the master list (placeholders, not real duty codes).
const ALWAYS_VALID_CODES = new Set(['--', '..']);

// ---- Report D: flag any code in the imported file that isn't in the duty-code master ----
function computeReportD(employees) {
  if (!validDutyCodes) return [];
  const flagged = [];
  employees.forEach(e => {
    const bad = [];
    e.codes.forEach((code, i) => {
      if (ALWAYS_VALID_CODES.has(code)) return;
      if (!validDutyCodes.has(code)) bad.push({ code, index: i });
    });
    if (bad.length > 0) flagged.push({ emp: e, bad });
  });
  return flagged;
}

// ---- Report A: configurable LP/MI/AB day-count threshold ----
let reportAThresholds = { MI: '', LP: '', AB: '' };

function computeReportA(employees) {
  const flat = [];
  // Only codes with a value actually entered are checked — empty box = no criteria for that code.
  const active = ['MI','LP','AB'].filter(code => reportAThresholds[code] !== '' && !isNaN(reportAThresholds[code]));
  if (active.length === 0) return flat;
  employees.forEach(e => {
    const counts = { MI: 0, LP: 0, AB: 0 };
    e.codes.forEach(c => { if (c in counts) counts[c]++; });
    let flagged = false;
    const reasons = [];
    active.forEach(code => {
      const th = Number(reportAThresholds[code]);
      if (counts[code] === th) { flagged = true; reasons.push(`${code} ${counts[code]} days`); }
    });
    if (flagged) flat.push({ emp: e, counts, reason: reasons.join('; ') });
  });
  flat.sort((a,b) => (b.counts.MI+b.counts.LP+b.counts.AB) - (a.counts.MI+a.counts.LP+a.counts.AB));
  return flat;
}

// ---- Report A-2: employees marked Absent (AB) on one specific selected date ----
let reportA2Date = '';

function computeReportA2(employees, dayLabels) {
  if (!reportA2Date) return [];
  const d = new Date(reportA2Date + 'T00:00:00');
  if (isNaN(d)) return [];
  const targetIdx = dayLabels.findIndex(dl => dl.year === d.getFullYear() && dl.month === d.getMonth()+1 && dl.day === d.getDate());
  if (targetIdx === -1) return [];
  const flat = [];
  employees.forEach(e => {
    if (e.codes[targetIdx] === 'AB') flat.push({ emp: e, date: dayLabels[targetIdx].label });
  });
  return flat;
}

let stateHolidayDates = ['']; // array of 'YYYY-MM-DD' strings from date inputs

function computeReportB(employees, dayLabels) {
  const flat = [];
  employees.forEach(e => {
    const woDay = computeWeeklyOff(e, dayLabels);
    const violations = [];
    e.codes.forEach((code, i) => {
      const dl = dayLabels[i];
      if (!dl || code !== 'AB') return;
      if (woDay !== null && WEEKDAY_FULL[dl.weekday] === woDay) {
        violations.push({ date: dl.label });
      }
    });
    if (violations.length > 0) flat.push({ emp: e, violations });
  });
  return flat;
}

function computeReportC(employees, dayLabels) {
  const shSet = new Set();
  stateHolidayDates.forEach(ds => {
    if (!ds) return;
    const d = new Date(ds + 'T00:00:00');
    if (isNaN(d)) return;
    shSet.add(d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate());
  });

  const flat = [];
  employees.forEach(e => {
    const violations = [];
    e.codes.forEach((code, i) => {
      const dl = dayLabels[i];
      if (!dl || code !== 'AB') return;
      if (shSet.has(dl.year + '-' + dl.month + '-' + dl.day)) {
        violations.push({ date: dl.label });
      }
    });
    if (violations.length > 0) flat.push({ emp: e, violations });
  });
  return flat;
}

// ---- XLS export (each report downloads independently as a .xls file) ----
// Groups the report's flat items by employee section, ascending, for the export table
// (mirrors the on-screen grouping in renderCatBreakdown).
function groupBySectionAscending(flatItems) {
  const bySection = {};
  flatItems.forEach(item => {
    const sec = item.emp.section || 'UNSPECIFIED';
    (bySection[sec] = bySection[sec] || []).push(item);
  });
  const sections = Object.keys(bySection).sort((a, b) => {
    const na = parseInt(a, 10), nb = parseInt(b, 10);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });
  return { bySection, sections };
}

function getReportData(letter) {
  const employees = currentEmployees();
  const dayLabels = currentDayLabels();
  const p = periods[activeKey];
  let title, subtitle, flat, rowDetail;

  if (letter === 'A') {
    title = 'REPORT A-1: LEAVE';
    const fmt = (v) => v === '' ? 'not set' : ('= ' + v + ' days');
    subtitle = 'MI ' + fmt(reportAThresholds.MI) + ', LP ' + fmt(reportAThresholds.LP) + ', AB ' + fmt(reportAThresholds.AB);
    flat = computeReportA(employees);
    rowDetail = (item) => item.reason;
  } else if (letter === 'A2') {
    title = 'REPORT A-2: ABSENT ON SELECTED DATE';
    subtitle = reportA2Date ? ('Date checked: ' + reportA2Date) : 'No date selected';
    flat = computeReportA2(employees, dayLabels);
    rowDetail = (item) => item.date + ' = AB';
  } else if (letter === 'B') {
    title = 'REPORT B: WEEKOFF - ABSENT';
    subtitle = '';
    flat = computeReportB(employees, dayLabels);
    rowDetail = (item) => item.violations.map(v => v.date + ' = AB').join('; ');
  } else if (letter === 'C') {
    title = 'REPORT C: STATE HOLIDAY - ABSENT';
    const shList = stateHolidayDates.filter(Boolean);
    subtitle = 'State holidays checked: ' + (shList.length ? shList.join(', ') : 'none entered');
    flat = computeReportC(employees, dayLabels);
    rowDetail = (item) => item.violations.map(v => v.date + ' = AB').join('; ');
  } else {
    title = 'REPORT D: CHECK THE ENTRY';
    subtitle = validDutyCodes ? (validDutyCodes.size + ' valid codes loaded from attcode.dbf') : 'No duty-code master loaded';
    flat = computeReportD(employees);
    rowDetail = (item) => item.bad.map(b => (dayLabels[b.index] ? dayLabels[b.index].label : '#' + (b.index + 1)) + ' = "' + b.code + '"').join('; ');
  }

  const { bySection, sections } = groupBySectionAscending(flat);
  return { title, subtitle, p, total: flat.length, sections, bySection, rowDetail };
}

// ---- Minimal real .xlsx (OOXML) writer — no external libraries, fully offline ----
// A .xlsx is a ZIP archive of specific XML parts. We build both the ZIP container
// (store/no-compression, which is valid ZIP) and the XML parts by hand.

function crc32(bytes) {
  if (!crc32.table) {
    const t = [];
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    crc32.table = t;
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ crc32.table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function strToBytes(str) { return new TextEncoder().encode(str); }

function createZip(files) {
  const localChunks = [];
  const centralChunks = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  files.forEach(file => {
    const nameBytes = strToBytes(file.name);
    const data = file.data;
    const crc = crc32(data);
    const size = data.length;

    const local = new Uint8Array(30 + nameBytes.length);
    const ldv = new DataView(local.buffer);
    ldv.setUint32(0, 0x04034b50, true);
    ldv.setUint16(4, 20, true);
    ldv.setUint16(6, 0, true);
    ldv.setUint16(8, 0, true); // store, no compression
    ldv.setUint16(10, dosTime, true);
    ldv.setUint16(12, dosDate, true);
    ldv.setUint32(14, crc, true);
    ldv.setUint32(18, size, true);
    ldv.setUint32(22, size, true);
    ldv.setUint16(26, nameBytes.length, true);
    ldv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    localChunks.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(central.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, dosTime, true);
    cdv.setUint16(14, dosDate, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralChunks.push(central);

    offset += local.length + data.length;
  });

  const centralStart = offset;
  let centralSize = 0;
  centralChunks.forEach(c => centralSize += c.length);

  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralStart, true);
  edv.setUint16(20, 0, true);

  const allChunks = localChunks.concat(centralChunks, [end]);
  let total = 0;
  allChunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let pos = 0;
  allChunks.forEach(c => { out.set(c, pos); pos += c.length; });
  return out;
}

function escapeXml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}

function colLetter(idx0) { // 0-indexed column -> "A", "B", ... "AA"
  let n = idx0 + 1, s = '';
  while (n > 0) { const rem = (n - 1) % 26; s = String.fromCharCode(65 + rem) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

function rowsToSheetXml(rows) {
  let xml = '';
  rows.forEach((row, ri) => {
    const rowNum = ri + 1;
    let cells = '';
    row.forEach((val, ci) => {
      const ref = colLetter(ci) + rowNum;
      if (val === null || val === undefined || val === '') { cells += `<c r="${ref}"/>`; return; }
      if (typeof val === 'number' && isFinite(val)) { cells += `<c r="${ref}"><v>${val}</v></c>`; return; }
      cells += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escapeXml(val)}</t></is></c>`;
    });
    xml += `<row r="${rowNum}">${cells}</row>`;
  });
  return xml;
}

function buildXlsxBytes(rows, sheetName) {
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '</Types>';
  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';
  const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets><sheet name="' + escapeXml(sheetName).slice(0, 31) + '" sheetId="1" r:id="rId1"/></sheets>' +
    '</workbook>';
  const workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
    '</Relationships>';
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetData>' + rowsToSheetXml(rows) + '</sheetData>' +
    '</worksheet>';

  const files = [
    { name: '[Content_Types].xml', data: strToBytes(contentTypes) },
    { name: '_rels/.rels', data: strToBytes(rootRels) },
    { name: 'xl/workbook.xml', data: strToBytes(workbook) },
    { name: 'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRels) },
    { name: 'xl/worksheets/sheet1.xml', data: strToBytes(sheet) },
  ];
  return createZip(files);
}

function downloadReportXLS(letter) {
  const data = getReportData(letter);
  const rows = [];
  rows.push(['MTC (CHENNAI) LTD' + (data.p.dataset.meta.branch ? ' - ' + data.p.dataset.meta.branch + ' BRANCH' : '')]);
  rows.push([data.title + ' — ' + data.p.monthLabel]);
  if (data.subtitle) rows.push([data.subtitle]);
  rows.push(['Cycle: ' + data.p.rangeLabel]);
  rows.push(['EMPLOYEE (TOTAL): ' + data.total]);
  rows.push([]);
  rows.push(['Section', 'Employee No.', 'Name', 'Details']);
  if (data.total === 0) {
    rows.push(['No entries found.']);
  } else {
    data.sections.forEach(sec => {
      data.bySection[sec].forEach(item => {
        rows.push([sec, item.emp.staffno, item.emp.name, data.rowDetail(item)]);
      });
    });
  }
  const bytes = buildXlsxBytes(rows, 'Report ' + letter);
  const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'attendance_report_' + letter + '_' + data.p.monthLabel.replace(/\s+/g, '_') + '.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Groups a flat list of {emp, ...} entries by employee section, ascending numeric order,
// and renders them with the same expandable-group UI the reports use.
function renderCatBreakdown(containerId, flatItems, rowRenderer) {
  if (!flatItems || flatItems.length === 0) return { html: '', total: 0 };
  const bySection = {};
  flatItems.forEach(item => {
    const sec = item.emp.section || 'UNSPECIFIED';
    (bySection[sec] = bySection[sec] || []).push(item);
  });
  const sections = Object.keys(bySection).sort((a, b) => {
    const na = parseInt(a, 10), nb = parseInt(b, 10);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });
  let html = '';
  let total = 0;
  sections.forEach(sec => {
    const items = bySection[sec];
    total += items.length;
    html += `<div class="cat-flag-group">
      <div class="cat-flag-header" data-cat="${containerId}-${sec}">
        <span class="cat-flag-name">Section ${sec}</span>
        <span class="cat-flag-count">${items.length}</span>
      </div>
      <div class="flag-list" data-catlist="${containerId}-${sec}" style="display:none;">`;
    items.forEach(item => { html += rowRenderer(item); });
    html += `</div></div>`;
  });
  return { html, total };
}

// Category summary cards — shared between the front screen (once a month is
// loaded) and the full Report Summary page.
function buildCategoryCardsHtml(employees) {
  const catCounts = {};
  CAT_ORDER.forEach(name => catCounts[name] = 0);
  employees.forEach(e => catCounts[employeeCategory(e.staffno)]++);
  let html = '<div class="summary-grid">';
  CAT_ORDER.forEach(name => {
    if (catCounts[name] === 0) return;
    html += `<div class="cat-card">
      <div class="cat-name">${name}</div>
      <div class="cat-count">${catCounts[name]}</div>
      <div class="cat-count-lbl">Employees</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderSummary() {
  summaryOpen = true;
  const employees = currentEmployees();
  const dayLabels = currentDayLabels();
  const p = periods[activeKey];

  const catsHtml = buildCategoryCardsHtml(employees);

  // Report A-1 — Leave (fixed MI / LP / AB threshold boxes, max 3 digits each)
  const repA = computeReportA(employees);
  const rowA = ({emp, reason}) => `<div class="flag-row" data-staffno="${emp.staffno}">
      <div class="id-block">
        <span class="staffno">${emp.staffno}</span>
        <span class="name">${emp.name}</span>
        <span class="desig">${emp.designation || ''}</span>
      </div>
      <span class="badge-days">${reason}</span>
    </div>`;
  const { html: repAHtml, total: repATotal } = renderCatBreakdown('A', repA, rowA);

  const noThresholdSet = reportAThresholds.MI === '' && reportAThresholds.LP === '' && reportAThresholds.AB === '';
  const reportAHtml = `<div class="report-block">
    <div class="report-heading">Report A-1 — Leave</div>
    <div class="report-controls">
      <label class="report-field">MI <input type="number" min="0" max="999" maxlength="3" id="thMI" value="${reportAThresholds.MI}" placeholder="days" oninput="if(this.value.length>3)this.value=this.value.slice(0,3);"></label>
      <label class="report-field">LP <input type="number" min="0" max="999" maxlength="3" id="thLP" value="${reportAThresholds.LP}" placeholder="days" oninput="if(this.value.length>3)this.value=this.value.slice(0,3);"></label>
      <label class="report-field">AB <input type="number" min="0" max="999" maxlength="3" id="thAB" value="${reportAThresholds.AB}" placeholder="days" oninput="if(this.value.length>3)this.value=this.value.slice(0,3);"></label>
      <button class="report-btn" id="reportAApplyBtn">Apply</button>
    </div>
    ${noThresholdSet ? '<div class="report-sub" style="margin:8px 0;">Enter an exact number of days in MI, LP, and/or AB above, then tap Apply.</div>' : ''}
    <div class="flag-banner" id="flagBannerA" style="${repATotal===0?'cursor:default;':''}">
      <div class="flag-title">Employee (Total)</div>
      <div class="flag-count">${repATotal}</div>
    </div>
    <div class="report-sub" style="margin: 6px 0 8px;">(Breakups)</div>
    <div id="flagBreakdownA">${repAHtml}</div>
    <button class="report-btn" id="printReportABtn" style="margin-top:12px;">Download Report A-1 as XLSX</button>
  </div>`;

  // Report A-2 — Absent employees on one selected date
  const repA2 = computeReportA2(employees, dayLabels);
  const rowA2 = ({emp, date}) => `<div class="flag-row" data-staffno="${emp.staffno}">
      <div class="id-block">
        <span class="staffno">${emp.staffno}</span>
        <span class="name">${emp.name}</span>
        <span class="desig">${emp.designation || ''}</span>
      </div>
      <span class="badge-days">${date} = AB</span>
    </div>`;
  const { html: repA2Html, total: repA2Total } = renderCatBreakdown('A2', repA2, rowA2);

  const reportA2Html = `<div class="report-block">
    <div class="report-heading">Report A-2 — Absent on selected date</div>
    <div class="report-controls">
      <label class="report-field">Date <input type="date" id="reportA2DateInput" value="${reportA2Date}"></label>
      <button class="report-btn" id="reportA2ApplyBtn">Apply</button>
    </div>
    ${!reportA2Date ? '<div class="report-sub" style="margin:8px 0;">Select a date within this month, then tap Apply.</div>' : ''}
    <div class="flag-banner" id="flagBannerA2" style="${repA2Total===0?'cursor:default;':''}">
      <div class="flag-title">Employee (Total)</div>
      <div class="flag-count">${repA2Total}</div>
    </div>
    <div class="report-sub" style="margin: 6px 0 8px;">(Breakups)</div>
    <div id="flagBreakdownA2">${repA2Html}</div>
    <button class="report-btn" id="printReportA2Btn" style="margin-top:12px;">Download Report A-2 as XLSX</button>
  </div>`;

  // Report B — Weekoff - Absent
  const repB = computeReportB(employees, dayLabels);
  const rowBC = ({emp, violations}) => violations.map(v => `<div class="flag-row" data-staffno="${emp.staffno}">
      <div class="id-block">
        <span class="staffno">${emp.staffno}</span>
        <span class="name">${emp.name}</span>
        <span class="desig">${emp.designation || ''}</span>
      </div>
      <span class="badge-days">${v.date} = AB</span>
    </div>`).join('');
  const { html: repBHtml, total: repBTotal } = renderCatBreakdown('B', repB, rowBC);

  const reportBHtml = `<div class="report-block">
    <div class="report-heading">Report B — Weekoff - Absent</div>
    <div class="report-sub">Flags any date that is an employee's Weekly Off but is marked <b>AB</b> (Absent) in the imported file.</div>
    <div class="flag-banner" id="flagBannerB" style="${repBTotal===0?'cursor:default;':''}">
      <div class="flag-title">Employee (Total)</div>
      <div class="flag-count">${repBTotal}</div>
    </div>
    <div class="report-sub" style="margin: 6px 0 8px;">(Breakups)</div>
    <div id="flagBreakdownB">${repBHtml}</div>
    <button class="report-btn" id="printReportBBtn" style="margin-top:12px;">Download Report B as XLSX</button>
  </div>`;

  // Report C — State Holiday - Absent
  const repC = computeReportC(employees, dayLabels);
  const { html: repCHtml, total: repCTotal } = renderCatBreakdown('C', repC, rowBC);

  let shInputsHtml = '';
  stateHolidayDates.forEach((d, i) => {
    shInputsHtml += `<div class="sh-date-row">
      <input type="date" class="sh-date-input" data-idx="${i}" value="${d || ''}">
      <button class="sh-remove-btn" data-idx="${i}" title="Remove">&times;</button>
    </div>`;
  });

  const reportCHtml = `<div class="report-block">
    <div class="report-heading">Report C — State Holiday - Absent</div>
    <div class="report-sub">Flags any listed State Holiday date that is marked <b>AB</b> (Absent) in the imported file.</div>
    <div class="sh-dates-wrap">
      <div class="report-sub" style="margin-bottom:6px;">State holiday dates</div>
      ${shInputsHtml}
      <button class="back-link" id="shAddBtn">+ Add another date</button>
    </div>
    <div class="flag-banner" id="flagBannerC" style="${repCTotal===0?'cursor:default;':''}">
      <div class="flag-title">Employee (Total)</div>
      <div class="flag-count">${repCTotal}</div>
    </div>
    <div class="report-sub" style="margin: 6px 0 8px;">(Breakups)</div>
    <div id="flagBreakdownC">${repCHtml}</div>
    <button class="report-btn" id="printReportCBtn" style="margin-top:12px;">Download Report C as XLSX</button>
  </div>`;

  // Report D — Check the Entry (codes not found in the duty-code master, attcode.dbf)
  const repD = computeReportD(employees);
  const rowD = ({emp, bad}) => bad.map(b => `<div class="flag-row" data-staffno="${emp.staffno}">
      <div class="id-block">
        <span class="staffno">${emp.staffno}</span>
        <span class="name">${emp.name}</span>
        <span class="desig">${emp.designation || ''}</span>
      </div>
      <span class="badge-days">${dayLabels[b.index] ? dayLabels[b.index].label : '#'+(b.index+1)} = "${b.code}" (unrecognised)</span>
    </div>`).join('');
  const { html: repDHtml, total: repDTotal } = renderCatBreakdown('D', repD, rowD);

  const reportDHtml = `<div class="report-block">
    <div class="report-heading">Report D — Check the Entry</div>
    <div class="report-sub">${validDutyCodes
      ? `Flags any code in the imported file that isn't in the duty-code master (${validDutyCodes.size} valid codes loaded).`
      : 'Upload a duty-code master file (attcode.dbf) via "2. Update duty code file" above to enable this check.'}</div>
    <div class="flag-banner" id="flagBannerD" style="${repDTotal===0?'cursor:default;':''}">
      <div class="flag-title">Employee (Total)</div>
      <div class="flag-count">${repDTotal}</div>
    </div>
    <div class="report-sub" style="margin: 6px 0 8px;">(Breakups)</div>
    <div id="flagBreakdownD">${repDHtml}</div>
    <button class="report-btn" id="printReportDBtn" style="margin-top:12px;" ${!validDutyCodes ? 'disabled' : ''}>Download Report D as XLSX</button>
  </div>`;

  const totalEmployees = employees.length;
  mainEl.innerHTML = `<button class="back-link" id="summaryBackBtn">← Back to search</button>
    <div class="card">
      <div class="cal-section-title"><span>Report Summary — ${p.monthLabel} (${totalEmployees} employees overall)</span><span class="rule"></span></div>
      ${catsHtml}
      <div class="cal-section-title"><span>Reports</span><span class="rule"></span></div>
      ${reportAHtml}
      ${reportA2Html}
      ${reportBHtml}
      ${reportCHtml}
      ${reportDHtml}
    </div>`;

  // --- wire up events ---
  document.getElementById('summaryBackBtn').addEventListener('click', () => { summaryOpen = false; renderList(); });
  document.getElementById('printReportABtn').addEventListener('click', () => downloadReportXLS('A'));
  document.getElementById('printReportA2Btn').addEventListener('click', () => downloadReportXLS('A2'));
  document.getElementById('printReportBBtn').addEventListener('click', () => downloadReportXLS('B'));
  document.getElementById('printReportCBtn').addEventListener('click', () => downloadReportXLS('C'));
  if (validDutyCodes) document.getElementById('printReportDBtn').addEventListener('click', () => downloadReportXLS('D'));

  document.getElementById('reportAApplyBtn').addEventListener('click', () => {
    ['MI','LP','AB'].forEach(code => {
      const raw = document.getElementById('th'+code).value.trim();
      if (raw === '') { reportAThresholds[code] = ''; return; }
      let v = parseInt(raw, 10);
      if (isNaN(v)) { reportAThresholds[code] = ''; return; }
      v = Math.max(0, Math.min(999, v));
      reportAThresholds[code] = v;
    });
    renderSummary();
  });

  document.getElementById('reportA2ApplyBtn').addEventListener('click', () => {
    reportA2Date = document.getElementById('reportA2DateInput').value || '';
    renderSummary();
  });

  document.getElementById('shAddBtn').addEventListener('click', () => {
    stateHolidayDates.push('');
    renderSummary();
  });
  mainEl.querySelectorAll('.sh-date-input').forEach(input => {
    input.addEventListener('change', (ev) => {
      stateHolidayDates[parseInt(ev.target.dataset.idx,10)] = ev.target.value;
      renderSummary();
    });
  });
  mainEl.querySelectorAll('.sh-remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      stateHolidayDates.splice(parseInt(btn.dataset.idx,10), 1);
      if (stateHolidayDates.length === 0) stateHolidayDates.push('');
      renderSummary();
    });
  });

  ['A','A2','B','C','D'].forEach(letter => {
    const bannerId = 'flagBanner' + letter, boxId = 'flagBreakdown' + letter;
    const total = letter === 'A' ? repATotal : (letter === 'A2' ? repA2Total : (letter === 'B' ? repBTotal : (letter === 'C' ? repCTotal : repDTotal)));
    if (total === 0) return;
    document.getElementById(bannerId).addEventListener('click', () => {
      const box = document.getElementById(boxId);
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    });
  });
  mainEl.querySelectorAll('.cat-flag-header').forEach(header => {
    header.addEventListener('click', () => {
      const list = mainEl.querySelector(`.flag-list[data-catlist="${header.dataset.cat}"]`);
      list.style.display = list.style.display === 'none' ? 'block' : 'none';
    });
  });
  mainEl.querySelectorAll('.flag-row').forEach(row => {
    row.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const emp = employees.find(e => e.staffno === row.dataset.staffno);
      if (emp) { summaryOpen = false; renderDetail(emp); }
    });
  });

  mainEl.scrollIntoView({behavior:'smooth'});
}

function renderList() {
  summaryOpen = false;
  if (!activeKey || !periods[activeKey]) {
    mainEl.innerHTML = `<div class="empty-state">
      <div class="big-icon">⤒</div>
      <h3>No attendance data loaded</h3>
      <p>Use "Import month" above to load a <code>cln????.txt</code> file and get started.</p>
    </div>`;
    resultCount.textContent = '';
    clearBtn.style.display = 'none';
    return;
  }

  const q = searchInput.value.trim().toUpperCase();
  const sec = sectionFilter.value;
  clearBtn.style.display = q ? 'block' : 'none';

  const employees = currentEmployees();
  const dayLabels = currentDayLabels();
  let filtered = employees;
  if (sec) filtered = filtered.filter(e => e.section === sec);
  if (q) {
    filtered = filtered.filter(e =>
      e.staffno.toUpperCase().includes(q) || e.name.toUpperCase().includes(q)
    );
  }

  if (!q && !sec) {
    const p = periods[activeKey];
    mainEl.innerHTML = `<div class="card">
      <div class="cal-section-title"><span>Attendance summary — ${p.monthLabel} (${employees.length} employees overall)</span><span class="rule"></span></div>
      ${buildCategoryCardsHtml(employees)}
      <div class="report-sub" style="margin-top:4px;">Type an employee number or name above to view their calendar, or tap "Report Summary" above for the full breakdown and reports.</div>
    </div>`;
    resultCount.textContent = '';
    return;
  }

  resultCount.textContent = filtered.length + ' match' + (filtered.length===1?'':'es');

  if (filtered.length === 0) {
    mainEl.innerHTML = `<div class="empty-state">
      <div class="big-icon">∅</div>
      <h3>No employee found</h3>
      <p>Try a different employee number or name.</p>
    </div>`;
    return;
  }

  if (filtered.length === 1) {
    renderDetail(filtered[0]);
    return;
  }

  let html = '<div class="list-view">';
  filtered.slice(0, 200).forEach((e) => {
    const stats = computeStats(e.codes);
    const present = (stats.PP||0)+(stats.DR||0)+(stats.OD||0)+(stats.PM||0)+(stats.OF||0); // PP, DR, OD, PM, OF all counted as Present
    const leave = (stats.CL||0)+(stats.EL||0)+(stats.ML||0);
    const absent = (stats.FA||0)+(stats.AB||0);
    const wo = computeWeeklyOff(e, dayLabels);
    html += `<div class="emp-row" data-idx="${employees.indexOf(e)}">
      <div class="id-block">
        <span class="staffno">${e.staffno}</span>
        <span class="name">${e.name}</span>
        <span class="desig">${e.designation}</span>
        ${wo ? `<span class="wo-tag">Weekly Off: ${wo}</span>` : ''}
      </div>
      <div class="mini-stats">
        <span>Present <b>${present}</b></span>
        <span>Leave <b>${leave}</b></span>
        <span>Absent <b>${absent}</b></span>
      </div>
    </div>`;
  });
  html += '</div>';
  mainEl.innerHTML = html;

  mainEl.querySelectorAll('.emp-row').forEach(row => {
    row.addEventListener('click', () => {
      const emp = employees[parseInt(row.dataset.idx)];
      renderDetail(emp);
    });
  });
}

function renderDetail(emp) {
  const dayLabels = currentDayLabels();
  const stats = computeStats(emp.codes);
  const present = (stats.PP||0)+(stats.DR||0)+(stats.OD||0)+(stats.PM||0)+(stats.OF||0); // PP, DR, OD, PM, OF all counted as Present
  const leave = (stats.CL||0)+(stats.EL||0)+(stats.ML||0);
  const weeklyOff = (stats.WO||0);
  const absent = (stats.FA||0)+(stats.AB||0);
  const wo = computeWeeklyOff(emp, dayLabels);

  let html = `<button class="back-link" id="backBtn">← Back to results</button>
  <div class="card">
    <div class="emp-header">
      <div>
        <div class="staffno-big">${emp.staffno}</div>
        <div class="name-row">
          <h2>${emp.name}</h2>
          ${wo ? `<span class="wo-tag">Weekly Off: ${wo}</span>` : ''}
        </div>
        <div class="desig-big">${emp.designation}</div>
      </div>
      <div class="meta-tags">
        <span class="tag">Section ${emp.section}</span>
        <span class="tag">${emp.branch || ''}</span>
      </div>
    </div>

    <div class="stats-strip">
      <div class="stat-box wo-box"><div class="num">${wo || '—'}</div><div class="lbl">Weekly Off Day</div></div>
      <div class="stat-box"><div class="num">${present}</div><div class="lbl">Present</div></div>
      <div class="stat-box"><div class="num">${leave}</div><div class="lbl">Leave</div></div>
      <div class="stat-box"><div class="num">${weeklyOff}</div><div class="lbl">Off Days Taken</div></div>
      <div class="stat-box"><div class="num">${absent}</div><div class="lbl">Absent</div></div>
      <div class="stat-box"><div class="num">${emp.leavebal.split(/\s+/)[0] || '-'}</div><div class="lbl">CL Bal.</div></div>
      <div class="stat-box"><div class="num">${emp.leavebal.split(/\s+/)[1] || '-'}</div><div class="lbl">EL Bal.</div></div>
      <div class="stat-box"><div class="num">${emp.leavebal.split(/\s+/)[2] || '-'}</div><div class="lbl">ML Bal.</div></div>
    </div>

    <div class="cal-section-title"><span>Duty Calendar · ${periods[activeKey].rangeLabel}</span><span class="rule"></span></div>
    ${renderCalendar(emp)}

    <div class="legend">
      <div class="legend-title">Legend</div>
      <div class="legend-items">${renderLegend(emp)}</div>
    </div>
  </div>`;

  mainEl.innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', () => { renderList(); });
  mainEl.scrollIntoView({behavior:'smooth'});
}

function renderCalendar(emp) {
  const dayLabels = currentDayLabels();
  const firstWeekday = dayLabels[0].weekday;
  const mondayIndex = (firstWeekday + 6) % 7;
  let html = '<div class="weekday-row">' + weekdayShort.map(w=>`<div>${w}</div>`).join('') + '</div>';
  html += '<div class="cal-grid">';
  for (let i = 0; i < mondayIndex; i++) html += '<div class="cal-cell"></div>';
  dayLabels.forEach((d, i) => {
    const code = emp.codes[i] || '--';
    const cls = codeClass(code);
    const style = CLASS_STYLE[cls];
    const boundary = (i > 0 && d.month !== dayLabels[i-1].month) ? ' month-boundary' : '';
    html += `<div class="cal-cell${boundary}" style="background:${style.bg}; color:${style.fg};" title="${d.label}: ${CODE_MEANING[code] || code}">
      <div class="date-lbl">${d.label}</div>
      <div class="code">${code}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderLegend(emp) {
  const used = [...new Set(emp.codes)].sort();
  return used.map(code => {
    const cls = codeClass(code);
    const style = CLASS_STYLE[cls];
    return `<div class="legend-item"><span class="legend-swatch" style="background:${style.bg}; border:1px solid ${style.fg}"></span>${code} — ${CODE_MEANING[code] || 'Unknown'}</div>`;
  }).join('');
}

function showImportMsg(text, ok) {
  importMsg.textContent = text;
  importMsg.className = 'import-msg show ' + (ok ? 'ok' : 'err');
  setTimeout(() => { importMsg.classList.remove('show'); }, 6500);
}

fileInput.addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const dataset = parseAttendanceText(e.target.result, file.name);
      const { key, evictedLabel } = registerDataset(dataset);
      activeKey = key;
      saveStore(activeKey);
      refreshPeriodSelect();
      refreshSectionFilter();
      updateHeaderLine();
      searchInput.value = '';
      sectionFilter.value = '';
      renderSummary();
      const dayCount = dataset.employees[0].codes.length;
      const evictNote = evictedLabel ? ` (dropped oldest loaded month: ${evictedLabel}, 5-month limit reached)` : '';
      showImportMsg(`Imported "${file.name}" — ${dataset.employees.length} employees, ${periods[key].monthLabel} attendance (${dayCount} day${dayCount===1?'':'s'})${evictNote}.`, true);
    } catch (err) {
      showImportMsg('Could not parse "' + file.name + '": ' + err.message, false);
    }
    fileInput.value = '';
  };
  reader.onerror = () => showImportMsg('Failed to read file.', false);
  reader.readAsText(file);
});

const dbfFileInput = document.getElementById('dbfFileInput');
dbfFileInput.addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = parseDBF(e.target.result);
      const { codes, meta } = extractDutyCodesFromDBF(parsed);
      if (codes.size === 0) throw new Error('No duty codes recognised in this file.');
      validDutyCodes = codes;
      dutyCodeMeta = meta;
      saveDutyCodes();
      if (activeKey) renderSummary();
      showImportMsg(`Updated duty code master from "${file.name}" — ${codes.size} valid codes loaded.`, true);
    } catch (err) {
      showImportMsg('Could not parse "' + file.name + '": ' + err.message, false);
    }
    dbfFileInput.value = '';
  };
  reader.onerror = () => showImportMsg('Failed to read file.', false);
  reader.readAsArrayBuffer(file);
});

periodSelect.addEventListener('change', () => {
  activeKey = periodSelect.value;
  saveStore(activeKey);
  refreshSectionFilter();
  updateHeaderLine();
  searchInput.value = '';
  sectionFilter.value = '';
  if (summaryOpen) { renderSummary(); } else { renderList(); }
});

searchInput.addEventListener('input', renderList);
sectionFilter.addEventListener('change', renderList);
clearBtn.addEventListener('click', () => { searchInput.value=''; renderList(); searchInput.focus(); });

document.getElementById('clearStoreBtn').addEventListener('click', () => {
  if (confirm('Remove ALL data, including the bundled sample month? The app will be completely empty until you import a file.')) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ cleared: true, datasets: [], activeKey: null }));
    } catch (e) {}
    location.reload();
  }
});

refreshPeriodSelect();
refreshSectionFilter();
updateHeaderLine();
renderList();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
